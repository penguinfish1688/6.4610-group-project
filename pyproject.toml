[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d2-omni"
version = "0.1.0"
description = "Streaming vision research for the Dialogue-to-Duplex backbone"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "transformers==5.13.0",
  "safetensors>=0.4.3",
  "numpy>=1.26.4",
  "Pillow>=10.0",
]

[project.optional-dependencies]
data = ["av>=14.0", "requests>=2.32", "scipy>=1.14"]
dev = ["pytest>=9.0", "ruff>=0.15"]

[tool.setuptools]
packages = ["model", "model.vision_encoder"]

[tool.setuptools.package-data]
"model.vision_encoder" = ["README.md", "UPSTREAM.json", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["model/backbone"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
